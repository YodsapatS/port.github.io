<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <title>เรียนรู้การเขียนเว็บ</title>

    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&display=swap" rel="stylesheet">

    <style>
        @import url(https://fonts.googleapis.com/css2?family=Anton&display=swap);
        @font-face {
            font-family: 'IBM_Plex_Sans_Thai';
            src: url('font/IBMPlexSansThai-Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;       
        }
        
    .container {
        color:rgb(243, 245, 245);
        font-size:large;
        text-align: center;
        border: 15px;
        margin: 0;
        position: relative;
        z-index: 1;
        top: 100;
        opacity: 0;
        animation: slideIn 1s forwards;
        line-height: 0.0;
    }
       @keyframes slideIn {
       to {
        top: 0;
        opacity: 1; 
    }
}



    .English {        
        font-family: 'Jersey 10';
        font-size: 120px;    }
    .Thai {        
        font-family: 'Anuphan';}

    .background-video {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    .input-box {
        width: 250px;
        margin-top: 90px;
        font-family: 'Anuphan';
    }


    </style>
    </head>

    <body>
        <video class="background-video" autoplay muted loop>
            <source src="background1.mp4" type="video/mp4">
        </video>

        <div class="container">
        <h1 class="English">PORTFOLIO</h1>
        <h2 class="Thai">นายยศพัทธ์ แสนศรีเชาว์พันธ์</h2>
        </div>
        
        <div style="text-align: center;">
        <h2 id="type your name"></h2>
        <input type="text" id="playername" placeholder="ใส่ชื่อตัวเอง" class="input-box" >
        <button style="font-family: 'Anuphan';" onclick="start()">ไปหน้าถัดไป</button>
        </div>

        <script>
            function start() {
                const name = document.getElementById("playername").value;
                if (name.trim() !=="") {
                window.location.href = "test2.html?name="+encodeURIComponent(name);
            } else {
                alert("กรุณากรอกชื่อตัวเอง");}}
                document.getElementById("playername").addEventListener ("keydown" ,function(event) {
                    if(event.key ==="Enter") {
                        start();
                    }
                });
        </script>
    </body>
</html>
