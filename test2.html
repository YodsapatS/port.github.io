    .famale, .lgbtq, .boy {

        position: absolute;

    .text-lgbtq {
        position: absolute;
        top: 20;
        left: 740;

    .text-male {
        position: absolute;
        top: 20;
        left: 1180;

        font-size: 25;
        color: aliceblue;
    }

    font-family: 'Jersey 10';
    color: aliceblue;

<body>

<div class="h2">
    <h2>Choose your character</h2>
</div>

<div class="image-row">

<script>

        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");
        const welcome = document.getElementById("welcome");

        welcome.classList.add("custom-font");

    if(name) {
        welcome.innerText = "ยินดีต้อนรับ ," + name + "!" ;
